<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StudyMate Notebook</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; padding: 48px 20px; background: #f5f4ee; color: #213c35; font-family: "Segoe UI", Arial, sans-serif; line-height: 1.6; }
    main { max-width: 960px; margin: auto; overflow: hidden; border: 1px solid #dedfd5; border-radius: 28px; background: #fffefa; box-shadow: 0 20px 60px #213c350a; }
    header { padding: 48px; background: #e6eee2; }
    .label { margin: 0 0 18px; font-size: .85rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 0; max-width: 700px; font-size: clamp(2.8rem, 7vw, 5rem); line-height: 1.08; letter-spacing: -.045em; overflow-wrap: break-word; }
    .audience { margin: 24px 0 0; font-size: 1.1rem; }
    .content { display: grid; grid-template-columns: 1.25fr 1fr; gap: 36px; padding: 40px 48px 48px; align-items: start; }
    h2 { margin: 0 0 20px; font-size: 1.4rem; }
    ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; }
    li { display: flex; align-items: center; gap: 12px; padding: 16px; border: 1px solid #e1e6db; border-radius: 14px; background: #f7f9f2; font-size: 1.05rem; }
    li::before { content: "✓"; color: #416144; font-weight: 700; }
    .price-card { padding: 28px; border-radius: 20px; background: #213c35; color: #fff; }
    .price-card h2 { margin-bottom: 10px; font-size: 1rem; color: #d7e6d9; }
    .price { margin: 0 0 24px; font-size: clamp(1.8rem, 4vw, 2.5rem); font-weight: 750; letter-spacing: -.03em; line-height: 1.3; }
    button { width: 100%; padding: 14px 18px; border: 0; border-radius: 12px; background: #e0efac; color: #213c35; font: inherit; font-weight: 700; cursor: pointer; }
    button:hover { background: #d2e791; }
    button:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
    @media (max-width: 650px) { body { padding: 16px 12px; } header { padding: 32px 24px; } .content { grid-template-columns: 1fr; padding: 28px 24px; gap: 28px; } }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="label">Tên sản phẩm</p>
      <h1>StudyMate Notebook</h1>
      <p class="audience">Dành cho sinh viên đại học</p>
    </header>
    <div class="content">
      <section aria-labelledby="benefits">
        <h2 id="benefits">Lợi ích sản phẩm</h2>
        <ul>
          <li>Ghi chú bài học</li>
          <li>Lập kế hoạch hàng tuần</li>
        </ul>
      </section>
      <section class="price-card" aria-labelledby="price-heading">
        <h2 id="price-heading">Giá sản phẩm</h2>
        <p class="price">80.000 VND</p>
        <button type="button">Tìm hiểu thêm</button>
      </section>
    </div>
    <div style="padding: 0 24px 28px; text-align: center;"><a href="home.html" style="display: inline-block; padding: 12px 24px; border: 1px solid currentColor; border-radius: 12px; color: inherit; background: transparent; font: inherit; font-weight: 600; text-decoration: none;">Trở về trang chính</a></div>
  </main>
</body>
</html>
