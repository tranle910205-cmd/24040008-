<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Career Day</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; padding: 48px 20px; color: #202047; background: #f2f0ff; font-family: "Segoe UI", Arial, sans-serif; line-height: 1.6; }
    main { max-width: 900px; margin: auto; background: #fff; border: 1px solid #dfdaf5; border-radius: 28px; overflow: hidden; box-shadow: 0 20px 60px #35277712; }
    header { padding: 48px; color: #fff; background: #4931a8; }
    .eyebrow { margin: 0 0 16px; font-size: .85rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(2.8rem, 8vw, 5rem); line-height: 1.1; letter-spacing: -.045em; }
    .audience { margin: 24px 0 0; color: #eeeaff; font-size: 1.1rem; }
    .content { padding: 32px 48px 42px; }
    .schedule { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .card { padding: 24px; border-radius: 18px; background: #f1edff; border: 1px solid #dfd6ff; }
    h2, dt { margin: 0 0 8px; font-size: .95rem; font-weight: 600; }
    .value { margin: 0; font-size: clamp(1.5rem, 4vw, 2rem); font-weight: 750; line-height: 1.3; }
    .deadline { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 24px; margin-top: 16px; background: #ddfa88; border: 1px solid #c8e96b; border-radius: 18px; color: #263b0b; }
    .deadline h2 { margin: 0; }
    dl { margin: 28px 0 0; display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    dl > div { padding-top: 18px; border-top: 1px solid #e5e2ef; }
    dd { margin: 0; font-size: 1.15rem; font-weight: 600; }
    .free { color: #3d6a1a; }
    @media (max-width: 600px) { body { padding: 16px 12px; } header { padding: 34px 24px; } .content { padding: 24px; } .schedule, dl { grid-template-columns: 1fr; } .deadline { align-items: flex-start; flex-direction: column; gap: 8px; } }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">Tên sự kiện</p>
      <h1>AI Career Day</h1>
      <p class="audience">Đối tượng: Sinh viên đại học</p>
    </header>
    <div class="content">
      <div class="schedule">
        <section class="card" aria-labelledby="date">
          <h2 id="date">Ngày</h2>
          <p class="value">15 tháng 11</p>
        </section>
        <section class="card" aria-labelledby="time">
          <h2 id="time">Thời gian</h2>
          <p class="value">14:00–16:00</p>
        </section>
      </div>
      <section class="deadline" aria-labelledby="deadline">
        <h2 id="deadline">Hạn đăng ký</h2>
        <p class="value">10 tháng 11</p>
      </section>
      <dl>
        <div><dt>Địa điểm</dt><dd>Phòng hội thảo A</dd></div>
        <div><dt>Chi phí</dt><dd class="free">Miễn phí</dd></div>
      </dl>
    </div>
    <div style="padding: 0 24px 28px; text-align: center;"><a href="home.html" style="display: inline-block; padding: 12px 24px; border: 1px solid currentColor; border-radius: 12px; color: inherit; background: transparent; font: inherit; font-weight: 600; text-decoration: none;">Trở về trang chính</a></div>
  </main>
</body>
</html>
