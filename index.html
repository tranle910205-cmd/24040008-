<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lê Huỳnh Bảo Trân</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; padding: 48px 20px; background: #f3f6f3; color: #223b32; font-family: "Segoe UI", Arial, sans-serif; line-height: 1.7; }
    main { max-width: 820px; margin: 0 auto; overflow: hidden; background: #fff; border: 1px solid #dce5de; border-radius: 24px; box-shadow: 0 16px 48px #223b320a; }
    header { padding: 48px; background: #e7efe9; border-bottom: 1px solid #dce5de; }
    .label { margin: 0 0 12px; color: #4a6859; font-size: .85rem; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(2rem, 6vw, 3.2rem); line-height: 1.25; letter-spacing: -.035em; }
    .major { margin: 18px 0 0; font-size: 1.1rem; }
    .content { padding: 12px 48px 28px; }
    section { padding: 26px 0; }
    section + section { border-top: 1px solid #e5ebe6; }
    h2 { margin: 0 0 12px; font-size: 1.15rem; }
    p { margin: 0; }
    ul { display: flex; flex-wrap: wrap; gap: 10px; list-style: none; padding: 0; margin: 0; }
    li { padding: 7px 16px; border-radius: 24px; background: #edf3ee; color: #345542; }
    @media (max-width: 540px) { body { padding: 20px 12px; } header { padding: 32px 24px; } .content { padding: 8px 24px 16px; } }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="label">Họ và tên</p>
      <h1>Lê Huỳnh Bảo Trân</h1>
      <p class="major"><strong>Chuyên ngành:</strong> Quan hệ công chúng (PR)</p>
    </header>
    <div class="content">
      <section aria-labelledby="skills">
        <h2 id="skills">Kỹ năng</h2>
        <ul><li>Làm việc nhóm</li><li>Giao tiếp</li></ul>
      </section>
      <section aria-labelledby="goals">
        <h2 id="goals">Mục tiêu nghề nghiệp</h2>
        <p>Trở thành event planner</p>
      </section>
    </div>
    <div style="padding: 0 24px 28px; text-align: center;"><a href="home.html" style="display: inline-block; padding: 12px 24px; border: 1px solid currentColor; border-radius: 12px; color: inherit; background: transparent; font: inherit; font-weight: 600; text-decoration: none;">Trở về trang chính</a></div>
  </main>
</body>
</html>
